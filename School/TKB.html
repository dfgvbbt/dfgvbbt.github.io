<html>

<head>
    <title>Thời Khóa Biểu</title>
</head>
<body>
<script>
function NewElement(TagName,Parent,Window_Op,Proties_Op) {
  var nill,Yo
  if (Parent == nill || Parent == null) {Parent = document.body}
  if (Window_Op !== nill) {
    Yo = Window_Op.document.createElement(TagName)
    Parent.appendChild(Yo)
  } else {
    Yo = document.createElement(TagName)
    Parent.appendChild(Yo)
  }
  if (Proties_Op !== nill && Proties_Op !== {}) {
    for (var index in Proties_Op) {
      Yo[index] = Proties_Op[index]
    }
  }
  return Yo
}
var Thu = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy']
var Ngay = new Date().getDay()
if ((Number(location.hash.substring(1)) && Number(location.hash.substring(1)) <= 7 && Number(location.hash.substring(1) >= 0)) ||
   location.hash.length==3 && location.hash[2] <= 7 && (location.hash[1] == '+'|| location.hash[1] == '-')) {
    var nill = location.hash.length==3?Ngay+location.hash[2]*(location.hash[1]=='+'?1:-1):location.hash[1]
    if (confirm('Bạn có muốn xem TKB của ngày ' + Thu[nill].toLocaleLowerCase() + ' không?')) {
        Ngay = nill
    }
}
Thu = Thu[Ngay]
var MonVT = { // Viết Tắt
    NV:'Ngữ văn',
    CN:'Công nghệ',
    TA:'Tiếng anh',
    DL:'Địa lí',
    LS:'Lịch sử',
    LSDL:'Lịch sử/Địa lí',
    SHDC:'Sinh hoạt dưới cờ',
    SHCN:'Sinh hoạt chủ nhiệm',
    SHTT:'Sinh hoạt tập thể',
    HDTN:'Hoạt động trải nghiệm',
    KHTN:'Khoa học tự nhiên',
    VL:'Vật lí',
    AN:'Âm nhạc',
    T:'Toán',
    TH:'Tin Học',
    GDTC:'Giáo dục thể chất(Thể dục)',
    TD:'Thể dục',
    KTPL:'Giáo dục kinh tế - pháp luật',
    QPAN:'Giáo dục quốc phòng - an ninh',
    GDCD:'Giáo dục công dân',
    MT:'Mĩ thuật',
}
var TKB = [
    ['SHDC','KHTN','KHTN','GDTC','CN'],
    ['CN','GDTC','NV','DL','AM'],
    ['MT','NV','NV','KHTN','HDTN'],
    ['HDTN','GDCD','TA','DL','T'],
    ['NV','TA','TA','T','T'],
    ['LS','T','TH','HDTN','SHCN'],
]
console.log(TKB[Ngay])
var TGtN = [
    //có thể sai số ở đây, không chắc nữa
    {
        Buoi: "Sáng",
        start: 1, // một giờ... "sáng"?
        TGB: [
            ["6:55","7:40"], ["8:0","8:45"], ["8:50","9:35"], ["9:45","10:30"], ["10:35","11:20"]
        ]
    },{Buoi: "Trưa",start:11},{ //thời gian nghỉ
        Buoi: "Chiều",
        start: 12.5, // 12:30
        TGB: [
            ["12:40","13:25"], ["13:30","14:15"], ["14:35","15:20"], ["15:25","16:10"], ["16:20","17:05"]
        ]
    },{Buoi: "Tối",start:19},
    {Buoi:"Đêm",start:22}
]

var TKB = [
    [], //bỏ chủ nhật
    [,,["VL","TH","HDTN","HDTN","SHTT"]], // 2 dấu "," là để bỏ qua buổi sáng và trưa
    [[,,"GDTC","GDTC"],,["NV","NV","CN","KTPL","TA"]],
    [,,["GDDP","LS","NV","VL","VL"]],
    [["HDTN","HDTN","HDTN","HDTN"],,["TA","TA","KTPL"]],
    [,,["TH","TH","T","T","QPAN"]],
    [,["T","T","CN","LS","SHTT"]]
]

var Buoi = TGtN.reduce((p, c) => (c.start <= new Date().getHours()+new Date().getMinutes()/60 && c.start > (p.start || 0) ? c : p), 0).Buoi;

function Add(Name,Time){
    console.log(Name)
    var This = NewElement('h2',document.body,window,{innerText:Name})
    var Begin = Time[0].split(':')
    var End = Time[1].split(':')
    x = (new Date()).getHours()*60+(new Date()).getMinutes()
    y = Begin[0]*60+Begin[1]
    z = End[0]*60+End[1]
    var Yellow = '#f6ff00' //going
    var Green = '#00ff40' //Passed

    This.title = `[${Time[0]} - ${Time[1]}] ` //định thêm thông tin môn học (như tên GV), nhma để sau
    This.style.color = x<y?'':( //future
        (x>=y&&x<z)?Yellow:Green
    )
    
    
    return This
}

var _Tuan = Math.floor((((new Date()) - (new Date(2025, 8, 8))) / (1000 * 60 * 60 * 24))/7) + 1
var Time = NewElement('h1',document.body)
Time.innerText = (new Date()).getDate() + '/' + Number((new Date()).getMonth()+1) + '/' + (new Date()).getFullYear() + ' | '+Buoi+' | '+ Thu + ' | Tuần '+_Tuan

var TKBHN = NewElement('h1',document.body,window,{innerText:'Thời Khóa Biểu Hôm Nay\n'})


if (!TKB[Ngay].length) TKBHN.innerText+= 'Không học hôm nay';
else {
    for (i in TKB[Ngay]) { //buổi
        if (!TKB[Ngay][i]?.length) continue;
        var TG = TGtN[i]
        if (!TG?.TGB) {
            alert("Lỗi: không có thời gian biểu vào ngày "+Thu+' buổi '+(TG?.Buoi||"<lỗi>"));
            continue
        }
        
        Buoi = NewElement('h1',document.body,window,{innerText:'Buổi '+TGtN[i].Buoi})
        let start,end //bằng cách nào đó, việc chỉnh start/end trong này thì trong loop lại ko biết chúng, khiến cho chúng nó thành global chứ không phải trong block của for parent?
        for (i2 in TKB[Ngay][i]) { //môn
            if (!TG.TGB[i2]) alert("Thiếu thời gian cho môn thứ "+(i2+1)+" của buổi "+TG.Buoi);
            if (TKB[Ngay][i][i2]) {
                console.log(TG.TGB[i2])
                Add(MonVT[TKB[Ngay][i][i2]],TG.TGB[i2]);
                start = start || TG.TGB[i2][0]
                end = TG.TGB[i2][1]
            }
        }
        Buoi = NewElement('span',Buoi,window,{innerText:` (${start} - ${end})`})
        console.log(TG)
        Buoi.style.fontSize = 'small';
        Buoi.style.position = 'absolute'
        NewElement('span',Buoi.parentElement,window,{innerText:':'})
        if (start !== TG.TGB[0][0] || end !== TG.TGB[TG.TGB.length-1][1]) Buoi.style.color = 'aqua' //highlight về sớm/đi trễ
    }
}
</script>
